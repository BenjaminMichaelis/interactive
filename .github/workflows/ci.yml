name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
    # NOTE: paths-ignore is duplicated under push and pull_request because
    # GitHub Actions does not support YAML anchors. Keep both lists in sync.
    paths-ignore:
      - '**/*.md'
      - '.config/**'
      - '.devcontainer/**'
      - '.vscode/**'
      - 'assets/**'
      - 'docs/**'
      - 'images/**'
      - '.editorconfig'
      - '.gitignore'
      - '*.txt'
      - '*.github-issues'
  pull_request:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
      - 'release/**'
    paths-ignore:
      - '**/*.md'
      - '.config/**'
      - '.devcontainer/**'
      - '.vscode/**'
      - 'assets/**'
      - 'docs/**'
      - 'images/**'
      - '.editorconfig'
      - '.gitignore'
      - '*.txt'
      - '*.github-issues'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * Mon'
    - cron: '0 8 * * Wed'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  DOTNET_INTERACTIVE_FRONTEND_NAME: CI
  DOTNET_INTERACTIVE_SIGN_TYPE: Test

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 200
    permissions:
      contents: read
      checks: write   # required by dorny/test-reporter (inside composite action)
    # SQL Server for the [MsSqlFact] tests in Microsoft.DotNet.Interactive.SqlServer.Tests.
    # Service containers only run on Linux runners; an empty image skips the service on Windows.
    services:
      mssql:
        image: ${{ matrix.runner == 'ubuntu-latest' && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env:
          ACCEPT_EULA: 'Y'
          # Keep in sync with the job-level MSSQL_SA_PASSWORD below (services can't read the env context).
          MSSQL_SA_PASSWORD: PolyglotCi2026Pass
        ports:
          - 1433:1433
    env:
      # Throwaway password for the CI-only SQL Server container above; not a secret.
      MSSQL_SA_PASSWORD: PolyglotCi2026Pass
    steps:
      # core.symlinks must be configured before checkout so git materialises
      # symlinks as real reparse points on Windows.  ensure-symlinks.ps1 also
      # recreates them explicitly as a belt-and-suspenders measure.
      - name: Configure git symlinks and long paths (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
        shell: pwsh

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Restore AdventureWorks into SQL Server (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          MSSQL_CONTAINER: ${{ job.services.mssql.id }}
          ADVENTUREWORKS_BAK_URL: https://github.com/Microsoft/sql-server-samples/releases/download/adventureworks/AdventureWorks2022.bak
        run: |
          set -euo pipefail
          sqlcmd() {
            docker exec "$MSSQL_CONTAINER" /opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -P "$MSSQL_SA_PASSWORD" "$@"
          }

          echo "Waiting for SQL Server to accept connections..."
          for i in $(seq 1 60); do
            if sqlcmd -Q "SELECT 1" > /dev/null 2>&1; then echo "SQL Server is up."; break; fi
            if [[ $i -eq 60 ]]; then echo "SQL Server did not start in time" >&2; docker logs "$MSSQL_CONTAINER" >&2; exit 1; fi
            sleep 2
          done

          curl -fsSL --retry 5 -o "$RUNNER_TEMP/AdventureWorks2022.bak" "$ADVENTUREWORKS_BAK_URL"
          docker exec -u 0 "$MSSQL_CONTAINER" mkdir -p /var/opt/mssql/backup
          docker cp "$RUNNER_TEMP/AdventureWorks2022.bak" "$MSSQL_CONTAINER:/var/opt/mssql/backup/AdventureWorks2022.bak"
          docker exec -u 0 "$MSSQL_CONTAINER" chown -R mssql /var/opt/mssql/backup

          sqlcmd -Q "RESTORE DATABASE AdventureWorks2022 FROM DISK = '/var/opt/mssql/backup/AdventureWorks2022.bak' WITH MOVE 'AdventureWorks2022' TO '/var/opt/mssql/data/AdventureWorks2022.mdf', MOVE 'AdventureWorks2022_log' TO '/var/opt/mssql/data/AdventureWorks2022_log.ldf', REPLACE"
          sqlcmd -d AdventureWorks2022 -Q "SELECT COUNT(*) AS AddressTypes FROM Person.AddressType"

          echo "TEST_MSSQL_CONNECTION_STRING=Server=localhost,1433;Database=AdventureWorks2022;User ID=sa;Password=$MSSQL_SA_PASSWORD;Encrypt=False;TrustServerCertificate=True" >> "$GITHUB_ENV"

      - uses: ./.github/actions/build-and-test

      # The [MsSqlFact] tests skip silently when they can't connect, so fail the job
      # if any SQL Server test was skipped instead of run on the Linux leg.
      - name: Verify SQL Server tests ran (Linux)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem artifacts/TestResults/Release -Recurse -Filter *.trx |
                      Where-Object { Select-String -Path $_.FullName -SimpleMatch 'Microsoft.DotNet.Interactive.SqlServer.Tests' -Quiet }
          if (-not $trxFiles) { Write-Error 'No test results found for Microsoft.DotNet.Interactive.SqlServer.Tests'; exit 1 }
          # Retries can leave several result files; judge the most recent run.
          $trx = $trxFiles | Sort-Object LastWriteTimeUtc | Select-Object -Last 1
          [xml]$doc = Get-Content $trx.FullName
          $results = @($doc.TestRun.Results.UnitTestResult)
          $results | Group-Object outcome | ForEach-Object { Write-Host "$($_.Name): $($_.Count)" }
          $skipped = @($results | Where-Object outcome -eq 'NotExecuted')
          if ($skipped) {
            $skipped | ForEach-Object { Write-Host "Skipped: $($_.testName)" }
            Write-Error "$($skipped.Count) SQL Server test(s) were skipped; is TEST_MSSQL_CONNECTION_STRING reaching a running SQL Server?"
            exit 1
          }
          if (-not ($results | Where-Object { $_.testName -like '*It_can_scaffold_a_DbContext_in_a_CSharpKernel*' -and $_.outcome -eq 'Passed' })) {
            Write-Error 'The EF Core DbContext scaffolding test did not pass.'
            exit 1
          }

      - name: Extract package version (Windows)
        if: runner.os == 'Windows'
        id: version
        shell: pwsh
        run: |
          $packagePattern = '^Microsoft\.dotnet-interactive\.(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)\.nupkg$'
          $packages = @(Get-ChildItem artifacts\packages\Release\Shipping\Microsoft.dotnet-interactive.*.nupkg -File -ErrorAction SilentlyContinue |
                       Where-Object { $_.Name -notlike '*.symbols.nupkg' -and $_.Name -match $packagePattern })
          if ($packages.Count -eq 0) {
            Write-Error "No bare Microsoft.dotnet-interactive package with a SemVer filename found"
            exit 1
          }
          if ($packages.Count -gt 1) {
            Write-Error "Multiple bare Microsoft.dotnet-interactive packages found: $($packages.Name -join ', ')"
            exit 1
          }
          $match = [regex]::Match($packages[0].Name, $packagePattern)
          if (-not $match.Success) {
            Write-Error "Package filename '$($packages[0].Name)' did not match expected SemVer pattern"
            exit 1
          }
          $ver = $match.Groups['version'].Value
          Write-Host "Detected version: $ver"
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Pack VSCode extensions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ${{ github.workspace }}\eng\package\PackVSCodeExtension.ps1 `
            -stableToolVersionNumber '${{ steps.version.outputs.version }}' `
            -outDir '${{ runner.temp }}\staging\vscode'
        working-directory: src

      - name: Pack NPM package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ${{ github.workspace }}\eng\package\PackNpmPackage.ps1 `
            -packageVersionNumber '${{ steps.version.outputs.version }}' `
            -outDir '${{ runner.temp }}\staging\npm'
        working-directory: src/polyglot-notebooks

      # Symbols packages are incomplete (see StripFilesFromSymbolPackages in eng/AfterSolutionBuild.targets),
      # so keep them out of the packages artifact, as the Azure Pipelines build did:
      # https://github.com/BenjaminMichaelis/interactive/blob/55a09aeaba91f7ba0496bcd9b627a519af66c8f5/eng/templates/build-and-test-tasks.yml#L108-L111
      - name: Remove symbols packages (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item artifacts/packages/Release/Shipping/*.symbols.nupkg -Force -ErrorAction SilentlyContinue

      - name: Upload packages (Windows)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: always() && runner.os == 'Windows'
        with:
          name: Windows-packages
          path: artifacts/packages/Release/Shipping
          retention-days: 30

      - name: Upload VSCode packages (Windows)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: always() && runner.os == 'Windows'
        with:
          name: Windows-vscode
          path: '${{ runner.temp }}\staging\vscode'
          retention-days: 30

      - name: Upload NPM package (Windows)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: always() && runner.os == 'Windows'
        with:
          name: Windows-npm
          path: '${{ runner.temp }}\staging\npm'
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: always()
        with:
          name: ${{ runner.os }}-test-results
          path: artifacts/TestResults/Release
          retention-days: 30

      - name: Upload build logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: always()
        with:
          name: ${{ runner.os }}-build-logs
          path: artifacts/log/Release
          retention-days: 14
